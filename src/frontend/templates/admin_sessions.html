{% extends "base.html" %}
{% block title %}Расписание — админ-панель{% endblock %}
{% block content %}
<h1>Расписание сеансов</h1>
<p><a class="btn" href="{{ url_for('admin_session_add') }}">+ Добавить сеанс</a></p>
<table class="data-table">
    <tr><th>ID</th><th>Фильм</th><th>Время</th><th>Зал</th><th>Цена</th><th>Действия</th></tr>
    {% for s in sessions %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>{{ s[4] }}</td>
            <td>{{ s[1] }}</td>
            <td>{{ s[2] }}</td>
            <td>{{ '%.0f'|format(s[3]) }} ₽</td>
            <td class="actions">
                <form method="POST" action="{{ url_for('admin_session_delete', session_id=s[0]) }}"
                      onsubmit="return confirm('Удалить сеанс «{{ s[4] }}» ({{ s[1] }})?');">
                    <button type="submit" class="btn btn-small btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
    {% endfor %}
</table>
{% endblock %}
