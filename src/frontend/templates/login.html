{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход в систему</h1>
<form class="form-card" method="POST" action="{{ url_for('login', next=next) }}">
    <label>Логин
        <input type="text" name="login" required placeholder="admin или demo">
    </label>
    <label>Пароль
        <input type="password" name="password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Войти</button>
</form>
<p class="hint">Демо-доступ: <b>admin / admin123</b> (администратор),
<b>demo / demo123</b> (клиент).</p>
{% endblock %}
