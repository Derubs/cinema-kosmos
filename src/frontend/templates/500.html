{% extends "base.html" %}
{% block title %}Ошибка сервера{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-code">500</div>
    <h1>Что-то пошло не так</h1>
    <p>Произошла внутренняя ошибка сервера. Она зафиксирована в журнале,
    и мы уже разбираемся. Попробуйте повторить действие позже.</p>
    <a class="btn" href="{{ url_for('index') }}">На главную</a>
</div>
{% endblock %}
